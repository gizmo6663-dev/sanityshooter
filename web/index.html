<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Mob Blaster</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <div id="stage"></div>

  <!-- In-round HUD -->
  <div id="hud" class="hidden">
    <div class="topbar">
      <div class="pill level">NIVÅ <b id="hud-level">1</b></div>
      <div class="pill coins">🪙 <b id="hud-coins">0</b></div>
      <button id="btn-pause" class="pill round" aria-label="Pause">❚❚</button>
    </div>
    <div id="hud-items" class="hud-items"></div>
    <div id="banner" class="banner"></div>
    <div id="hint">Hold fingeren nede og dra for å sikte</div>
    <div class="bottombar">
      <div class="castle">
        <span>🛡️</span>
        <div class="bar"><div id="hud-castle-fill"></div></div>
        <b id="hud-castle">10</b>
      </div>
      <button id="btn-giant" aria-label="Send kjempe">
        <div class="ring" id="giant-ring"></div>
        <div class="face">🦍<small>KJEMPE</small></div>
      </button>
    </div>
  </div>

  <!-- Hub: workshop with permanent upgrades, start / continue a run -->
  <div id="hub" class="screen hidden">
    <div class="logo"><span class="l1">MOB</span><span class="l2">BLASTER</span></div>
    <div class="shop-head">
      <div class="pill gems big">💎 <b id="hub-gems">0</b></div>
      <div class="pill">REKORD <b id="hub-best">0</b></div>
    </div>
    <div class="section-title">VERKSTED <small>permanente oppgraderinger</small></div>
    <div id="hub-cards" class="cards"></div>
    <div class="cta-stack">
      <button id="btn-run" class="cta">NY RUN ▶</button>
      <button id="btn-abandon" class="cta secondary hidden">AVSLUTT RUN</button>
    </div>
  </div>

  <!-- Item pick after a won round -->
  <div id="pick" class="screen hidden">
    <div id="pick-title" class="screen-title">VELG EN GJENSTAND</div>
    <div class="screen-sub">Tre gjenstander med samme type gir en forvandling.</div>
    <div id="pick-cards" class="pick-cards"></div>
  </div>

  <!-- Run shop between rounds -->
  <div id="runshop" class="screen hidden">
    <div class="screen-title">BUTIKK</div>
    <div class="shop-head">
      <div class="pill level">NESTE NIVÅ <b id="rs-level">1</b></div>
      <div class="pill coins big">🪙 <b id="rs-coins">0</b></div>
    </div>
    <div class="castle wide">
      <span>🛡️</span>
      <div class="bar"><div id="rs-castle-fill"></div></div>
      <b id="rs-castle">10</b>
    </div>
    <div class="section-title">TIL SALGS</div>
    <div id="rs-stock" class="cards"></div>
    <div class="row-buttons">
      <button id="btn-reroll" class="small-btn">🎲 Nye varer <span id="reroll-price"></span></button>
      <button id="btn-heal" class="small-btn">🔧 Reparer +4 <span id="heal-price"></span></button>
    </div>
    <div class="section-title">DINE GJENSTANDER <small>trykk for info</small></div>
    <div id="rs-synergy" class="synergy"></div>
    <div id="rs-items" class="item-row"></div>
    <button id="btn-next" class="cta">SPILL NIVÅ <span id="next-level">1</span> ▶</button>
  </div>

  <!-- Round result -->
  <div id="result" class="screen center hidden">
    <div class="result-box">
      <div id="result-title" class="result-title">SEIER!</div>
      <div id="result-sub" class="result-sub"></div>
      <div id="result-reward" class="result-coins">🪙 +<b id="result-coins">0</b></div>
      <button id="btn-continue" class="cta">FORTSETT</button>
    </div>
  </div>

  <!-- Pause -->
  <div id="pause" class="screen center hidden">
    <div class="result-box">
      <div class="result-title small">PAUSE</div>
      <div id="pause-items" class="item-row center"></div>
      <button id="btn-resume" class="cta">FORTSETT</button>
      <button id="btn-quit" class="cta secondary">GI OPP RUNDEN</button>
    </div>
  </div>

  <!-- Item info popup -->
  <div id="tip" class="tip hidden"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
