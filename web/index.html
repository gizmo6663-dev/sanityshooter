<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Dypet</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <div id="stage"></div>
  <div id="vignette"></div>
  <div id="hurt-flash"></div>

  <!-- In-game HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-left">
        <div id="hearts" class="hearts"></div>
        <div class="hud-line"><span class="coin">¢</span> <b id="hud-coins">0</b> <span class="floor-name" id="hud-floor">Kjelleren I</span></div>
      </div>
      <canvas id="minimap" width="160" height="160"></canvas>
    </div>
    <div class="xp"><div id="xp-fill"></div><span id="xp-level">1</span></div>
    <div id="boss-bar" class="boss-bar hidden"><div class="boss-name" id="boss-name"></div><div class="bar"><div id="boss-fill"></div></div></div>
    <div id="hud-items" class="hud-items"></div>
    <button id="btn-pause" class="icon-btn" aria-label="Pause">❚❚</button>
    <div id="stick" class="stick hidden"><div id="knob" class="knob"></div></div>
    <button id="btn-dash" class="dash" aria-label="Dash"><div id="dash-ring" class="dash-ring"></div><span>DASH</span></button>
  </div>

  <!-- Item / floor announcement, Isaac style -->
  <div id="announce" class="announce"><div id="announce-title"></div><div id="announce-sub"></div></div>

  <!-- Title -->
  <div id="title" class="screen center hidden">
    <div class="logo">DYPET</div>
    <div class="tagline">Det er bare én vei ut. Ned.</div>
    <button id="btn-start" class="btn">STIG NED</button>
    <div id="title-stats" class="stats"></div>
    <div class="help">Venstre tommel styrer. Du skyter automatisk.<br>Trykk DASH for å unngå skudd.</div>
  </div>

  <!-- Level up -->
  <div id="levelup" class="screen center hidden">
    <div class="screen-title">MØRKET GIR DEG KRAFT</div>
    <div class="screen-sub">Velg en velsignelse</div>
    <div id="perk-cards" class="cards"></div>
  </div>

  <!-- Pause -->
  <div id="pause" class="screen center hidden">
    <div class="screen-title">PAUSE</div>
    <div id="pause-items" class="item-list"></div>
    <div id="pause-stats" class="stats"></div>
    <button id="btn-resume" class="btn">FORTSETT</button>
    <button id="btn-giveup" class="btn ghost">GI OPP</button>
  </div>

  <!-- End of run -->
  <div id="end" class="screen center hidden">
    <div id="end-title" class="screen-title big">DU DØDE</div>
    <div id="end-sub" class="screen-sub"></div>
    <div id="end-items" class="item-list"></div>
    <button id="btn-again" class="btn">PRØV IGJEN</button>
  </div>

  <!-- Item info popup -->
  <div id="tip" class="tip hidden"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
