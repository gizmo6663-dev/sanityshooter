<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dypet – stilskisser</title>
<style>html,body{margin:0;background:#0d0806;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// Style mockups for choosing the game's look: ?style=light | moody | sheet
import * as S from './js/sprites.js';
import { drawRoom } from './js/roomart.js';

const style = new URLSearchParams(location.search).get('style') || 'light';
const c = document.getElementById('c');
const W = 412, H = 870, dpr = 2;
c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px'; c.style.height = H + 'px';
const g = c.getContext('2d');
g.scale(dpr, dpr);

function scene(t) {
  const s = 40, rw = 9 * s, rd = 13 * s, ox = (W - rw) / 2, oy = 185;
  g.fillStyle = '#0c0705'; g.fillRect(0, 0, W, H);
  drawRoom(g, { s, ox, oy, w: 9, d: 13, doors: { n: true, s: true, e: true, w: false }, seed: 5, doorStyle: { n: 'boss' } });
  const at = (i, j) => [ox + (i + 0.5) * s, oy + (j + 0.5) * s];

  // floor decals first
  for (const [i, j, sd] of [[2, 4, 1], [6.2, 8, 2], [3, 10.5, 3], [7, 2, 4], [4.5, 6.5, 6]]) { const [x, y] = at(i, j); S.bloodSplat(g, x, y, s, sd); }
  { const [x, y] = at(1.3, 6.2); S.puddle(g, x, y, s, 3); }
  { const [x, y] = at(3.3, 8.2); S.bloodSplat(g, x, y + 10, s, 9, [90, 130, 40]); }

  // things sorted by depth so nearer ones overlap farther ones
  const list = [];
  for (const [i, j, k] of [[1, 3, 1], [2, 3, 2], [7, 3, 3], [1, 9, 4], [7, 9, 5], [6, 9, 6]]) list.push(['rock', ...at(i, j), k]);
  list.push(['skull', ...at(0.4, 5)], ['bone', ...at(5.5, 1.2)], ['bone', ...at(2.6, 11.6)], ['skull', ...at(8.5, 12.1)]);
  list.push(['urn', ...at(0.3, 0.6)], ['urn', ...at(8.6, 7.0)]);
  list.push(['candle', ...at(0.25, 11.9), 1], ['candle', ...at(0.6, 12.2), 2], ['candle', ...at(8.6, 1.0), 3]);
  list.push(['grub', ...at(2, 6)]);
  list.push(['fly', ...at(5, 3)], ['fly', ...at(6, 4)], ['fly', ...at(4.5, 4.5)]);
  list.push(['eye', ...at(7.1, 6)]);
  list.push(['slime', ...at(3, 8.3)]);
  list.push(['ram', ...at(5.5, 6.5)]);
  list.push(['coin', ...at(1, 11)], ['coin', ...at(1.4, 11.3)]);
  list.push(['heart', ...at(7.4, 11.1)]);
  list.push(['hero', ...at(4, 10.4)]);
  list.sort((a, b) => a[2] - b[2]);
  for (const [k, x, y, sd] of list) {
    if (k === 'rock') S.rock(g, x, y + s * 0.42, s, sd);
    if (k === 'skull') S.skull(g, x, y, s, sd || 0.3);
    if (k === 'bone') S.bone(g, x, y, s, 0.6);
    if (k === 'urn') S.urn(g, x, y + s * 0.4, s, 1);
    if (k === 'candle') S.candle(g, x, y, s, t, sd);
    if (k === 'grub') S.grub(g, x, y, s, t);
    if (k === 'fly') S.fly(g, x, y, s, t + x * 0.1);
    if (k === 'eye') S.eyeball(g, x, y, s, t, { look: [-0.6, 0.8] });
    if (k === 'slime') S.slime(g, x, y, s, t);
    if (k === 'ram') S.ram(g, x, y, s, t);
    if (k === 'coin') S.coin(g, x, y, s, t + x);
    if (k === 'heart') S.heart(g, x, y, s);
    if (k === 'hero') S.hero(g, x, y, s * 1.2, t, { facing: 'down', moving: true });
  }
  // tears in flight
  const [hx, hy] = at(4, 10.4);
  for (const [dx, dy] of [[0.1, -2.0], [0.5, -3.6], [1.0, -5.1]]) S.tear(g, hx + dx * s, hy - 0.9 * s + dy * s, s);
  for (const [i, j] of [[6.3, 7.2], [5.7, 8.4]]) { const [x, y] = at(i, j); S.tear(g, x, y - 0.6 * s, s, { enemy: true }); }

  // light and air
  if (style === 'moody') {
    const dark = document.createElement('canvas');
    dark.width = W; dark.height = H;
    const d = dark.getContext('2d');
    d.fillStyle = 'rgba(8,4,2,0.8)';
    d.fillRect(0, 0, W, H);
    d.globalCompositeOperation = 'destination-out';
    for (const [x, y, r] of [[hx + 0.4 * s, hy - 0.4 * s, 210], [ox + 0.4 * s, oy + 12 * s, 90], [ox + 8.6 * s, oy + 1.4 * s, 90]]) {
      const gr = d.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(0.5, 'rgba(0,0,0,0.8)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      d.fillStyle = gr; d.fillRect(x - r, y - r, r * 2, r * 2);
    }
    g.drawImage(dark, 0, 0);
  }
  // warm light from the lantern and candles
  g.globalCompositeOperation = 'soft-light';
  for (const [x, y, r, a] of [[hx + 0.4 * s, hy - 0.4 * s, 220, 0.55], [ox + 0.4 * s, oy + 12 * s, 120, 0.5], [ox + 8.6 * s, oy + 1.4 * s, 120, 0.5]]) {
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(255,170,80,${a})`); gr.addColorStop(1, 'rgba(255,170,80,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  g.globalCompositeOperation = 'source-over';
  // dust motes
  let sd = 3;
  const rnd = () => ((sd = (sd * 16807) % 2147483647) / 2147483647);
  for (let k = 0; k < 45; k++) {
    g.fillStyle = `rgba(255,230,190,${0.08 + rnd() * 0.18})`;
    g.beginPath(); g.arc(ox + rnd() * rw, oy + rnd() * rd, 0.6 + rnd() * 1.4, 0, Math.PI * 2); g.fill();
  }
  // vignette
  const v = g.createRadialGradient(W / 2, H / 2 + 20, H * 0.28, W / 2, H / 2, H * 0.62);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(0,0,0,${style === 'moody' ? 0.75 : 0.55})`);
  g.fillStyle = v; g.fillRect(0, 0, W, H);

  // HUD
  for (let k = 0; k < 3; k++) S.heart(g, 24 + k * 28, 50, 38, { half: k === 2 });
  S.heart(g, 24 + 3 * 28, 50, 38, { empty: true });
  S.coin(g, 20, 84, 30, 0);
  g.font = 'bold 17px Georgia'; g.fillStyle = '#e8c070'; g.fillText('7', 32, 82);
  g.fillStyle = '#d8cfbc'; g.font = 'italic 15px Georgia'; g.fillText('Kjelleren I', 58, 82);
  // minimap
  g.save();
  g.translate(W - 98, 26);
  for (const [mx, my, k] of [[1, 2, 'v'], [1, 1, 'c'], [2, 1, 'v'], [1, 0, 'b'], [0, 1, 's'], [2, 2, 't']]) {
    g.fillStyle = k === 'c' ? '#e8e0d0' : k === 's' ? 'rgba(40,30,25,0.9)' : '#6a5a4c';
    g.fillRect(mx * 28, my * 20, 24, 16);
    g.strokeStyle = '#0a0604'; g.lineWidth = 2; g.strokeRect(mx * 28, my * 20, 24, 16);
    if (k === 'b' || k === 't') {
      g.font = 'bold 12px Georgia'; g.textAlign = 'center'; g.fillStyle = k === 'b' ? '#c4262c' : '#d8b25a';
      g.fillText(k === 'b' ? '☠' : '♛', mx * 28 + 12, my * 20 + 12);
    }
  }
  g.restore();
}

function sheet(t) {
  g.fillStyle = '#2a1e16'; g.fillRect(0, 0, W, H);
  let sd = 9;
  const rnd = () => ((sd = (sd * 16807) % 2147483647) / 2147483647);
  for (let k = 0; k < 5000; k++) { g.fillStyle = `rgba(255,240,220,${rnd() * 0.05})`; g.fillRect(rnd() * W, rnd() * H, 2, 2); }
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.2, W / 2, H / 2, H * 0.7);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.6)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  g.fillStyle = '#e8dcc4'; g.font = 'bold 22px Georgia'; g.textAlign = 'center';
  g.fillText('Figurer i tegnet stil', W / 2, 34);
  const label = (txt, x, y) => { g.font = 'italic 13px Georgia'; g.fillStyle = '#c8b898'; g.fillText(txt, x, y); };
  const s = 78;
  S.hero(g, 62, 180, s, t, { facing: 'down' }); label('ned', 62, 202);
  S.hero(g, 160, 180, s, t, { facing: 'left', moving: true }); label('venstre', 160, 202);
  S.hero(g, 258, 180, s, t + 0.13, { facing: 'right', moving: true }); label('høyre', 258, 202);
  S.hero(g, 352, 180, s, t, { facing: 'up' }); label('opp', 352, 202);
  S.fly(g, 62, 340, s * 1.25, t); label('Flue', 62, 362);
  S.grub(g, 165, 340, s, t); label('Larve', 165, 362);
  S.eyeball(g, 265, 340, s, t); label('Glaner', 265, 362);
  S.ram(g, 357, 340, s, t); label('Beinvær', 357, 362);
  S.slime(g, 70, 500, s, t); label('Slim', 70, 522);
  S.bloat(g, 255, 540, s * 0.85, t); label('Den oppsvulmede (boss)', 255, 565);
  S.rock(g, 55, 665, s, 3); label('Stein', 55, 690);
  S.urn(g, 135, 665, s, 1); label('Krukke', 135, 690);
  S.candle(g, 200, 665, s, t, 2); label('Lys', 200, 690);
  S.skull(g, 262, 660, s, 0.2); label('Hodeskalle', 262, 690);
  S.pedestal(g, 350, 665, s); label('Sokkel', 350, 690);
  S.heart(g, 50, 790, s); label('Hjerte', 50, 820);
  S.coin(g, 120, 790, s, 0.2); label('Mynt', 120, 820);
  S.tear(g, 190, 770, s); label('Skudd', 190, 820);
  S.tear(g, 252, 770, s, { color: '#ff8a3a' }); label('Ild', 252, 820);
  S.tear(g, 310, 770, s, { color: '#8af0ff' }); label('Is', 310, 820);
  S.tear(g, 370, 770, s, { enemy: true }); label('Fiende', 370, 820);
}

if (style === 'sheet') sheet(0.3); else scene(0.3);
window.done = true;
</script></body></html>
