name: Bygg APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # 22.04 er den mest utprøvde løperen for buildozer. Faller den bort,
    # bytt til ubuntu-latest — da må antakelig libncurses-dev-linja justeres.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # Python 3.11: p4a-oppskriftene er ikke pålitelige på 3.12+ ennå.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Gradle trenger JDK 17. Denne setter JAVA_HOME riktig.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Systempakker
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev \
            cmake build-essential ccache libltdl-dev

      # SDK, NDK og kompilerte oppskrifter er tunge. Uten cache tar hvert
      # bygg 30-40 minutter; med cache er andre bygg langt raskere.
      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      # Cython må være under 3.0 — ellers feiler p4a-oppskriftene på
      # longintrepr.h. setuptools pinnes av samme grunn.
      - name: Installer buildozer
        run: |
          python -m pip install --upgrade pip wheel
          pip install "Cython<3.0" "setuptools<71.0.0" buildozer

      - name: Bygg APK
        run: buildozer -v android debug

      - name: Last opp APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vanvidd-debug-apk
          path: bin/*.apk
          if-no-files-found: warn

      # Gjør feilsøking mulig uten å kjøre bygget på nytt.
      - name: Last opp byggelogg ved feil
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: .buildozer/android/platform/build-*/build.log
          if-no-files-found: ignore
