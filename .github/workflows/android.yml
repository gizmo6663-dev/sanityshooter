name: Bygg APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Røyktest av spillogikken
        run: node tools/balance.mjs 5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Bygg APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Gi APK-en et navn
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/MobBlaster-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MobBlaster-1.0.${{ github.run_number }}
          path: dist/*.apk

      # Every build becomes a GitHub release, so the APK can be downloaded
      # straight from the phone. Builds from other branches than the default
      # one are marked as pre-releases.
      - name: Publiser release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Mob Blaster 1.0.${{ github.run_number }}
          body: |
            Last ned **MobBlaster-1.0.${{ github.run_number }}.apk** under og åpne den på telefonen.
            Bygget fra `${{ github.ref_name }}` (${{ github.sha }}).
          files: dist/*.apk
          prerelease: ${{ github.ref_name != github.event.repository.default_branch }}
          make_latest: ${{ github.ref_name == github.event.repository.default_branch }}
